services:
  # Ollama keeps the model in a named volume so it is downloaded only once.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  model-download:
    # This one-time service pulls the fixed model before the app starts.
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen2.5-coder:3b"]
    restart: "no"

  app:
    # The app contains the web form, MCP server, Python workflow, and R.
    build: .
    depends_on:
      model-download:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5-coder:3b
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./output:/app/output

volumes:
  ollama-data:
